[package]
name = "term"
description = "Mitos terminal application, command handlers, event loop, and interactive UI"
include = ["src/**/*", "tests/fixtures/**/*", "README.md", "LICENSE"]
default-run = "ms"
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
categories.workspace = true
repository.workspace = true
homepage.workspace = true

[package.metadata.deb]
# generate a .deb in target/debian/ with the command: cargo deb --no-build
name = "mitos"
assets = [
  { source = "target/release/ms", dest = "/usr/lib/mitos/", mode = "755" },
  { source = "../../contrib/ms_launcher.sh", dest = "/usr/bin/ms", mode = "755" },
  { source = "../../runtime/*", dest = "/usr/lib/mitos/runtime/", mode = "644" },
  { source = "../../runtime/grammars/*", dest = "/usr/lib/mitos/runtime/grammars/", mode = "644" }, # to avoid sources/
  { source = "../../runtime/queries/**/*", dest = "/usr/lib/mitos/runtime/queries/", mode = "644" },
  { source = "../../runtime/themes/**/*", dest = "/usr/lib/mitos/runtime/themes/", mode = "644" },
  { source = "../../runtime/dictionaries/**/*", dest = "/usr/lib/mitos/runtime/dictionaries/", mode = "644" },
  { source = "../../README.md", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../LICENSE", dest = "/usr/share/doc/mitos/", mode = "644" },
  { source = "../../contrib/completion/ms.bash", dest = "/usr/share/bash-completion/completions/ms", mode = "644" },
  { source = "../../contrib/completion/ms.fish", dest = "/usr/share/fish/vendor_completions.d/ms.fish", mode = "644" },
  { source = "../../contrib/completion/ms.zsh", dest = "/usr/share/zsh/vendor-completions/_ms", mode = "644" },
  { source = "../../contrib/Mitos.appdata.xml", dest = "/usr/share/metainfo/com.github.matoous.Mitos.metainfo.xml", mode = "644" },
  { source = "../../book/theme/favicon.svg", dest = "/usr/share/icons/hicolor/scalable/apps/Mitos.svg", mode = "644" },
  { source = "../../contrib/Mitos.desktop", dest = "/usr/share/applications/Mitos.desktop", mode = "644" },
]

[package.metadata.generate-rpm]
# generate an .rpm in target/generate-rpm/ with the command (from the
# workspace root; -p takes the package PATH, not the crate name):
# cargo generate-rpm -p crates/term --profile opt
# The crate is named "term", so the package name must be overridden here.
name = "mitos"
# The grammar dylibs are dlopen-only but carry an executable bit on the build
# host, so the built-in auto-req would run ldd over ~300 of them and emit
# noisy soname requirements; the ms binary itself only links libc/libgcc.
# The one real requirement of the grammars is recorded manually below.
auto-req = "no"
assets = [
  { source = "target/release/ms", dest = "/usr/lib/mitos/", mode = "755" },
  { source = "../../contrib/ms_launcher.sh", dest = "/usr/bin/ms", mode = "755" },
  # *.so instead of * so neither grammars/sources/ nor .gitkeep is shipped.
  { source = "../../runtime/grammars/*.so", dest = "/usr/lib/mitos/runtime/grammars/", mode = "644" },
  { source = "../../runtime/queries/**/*", dest = "/usr/lib/mitos/runtime/queries/", mode = "644" },
  { source = "../../runtime/themes/**/*", dest = "/usr/lib/mitos/runtime/themes/", mode = "644" },
  { source = "../../runtime/dictionaries/**/*", dest = "/usr/lib/mitos/runtime/dictionaries/", mode = "644" },
  { source = "../../runtime/tutor", dest = "/usr/lib/mitos/runtime/tutor", mode = "644" },
  { source = "../../README.md", dest = "/usr/share/doc/mitos/", mode = "644", doc = true },
  { source = "../../LICENSE", dest = "/usr/share/doc/mitos/", mode = "644", doc = true },
  { source = "../../contrib/completion/ms.bash", dest = "/usr/share/bash-completion/completions/ms", mode = "644" },
  { source = "../../contrib/completion/ms.fish", dest = "/usr/share/fish/vendor_completions.d/ms.fish", mode = "644" },
  { source = "../../contrib/completion/ms.zsh", dest = "/usr/share/zsh/vendor-completions/_ms", mode = "644" },
  { source = "../../contrib/Mitos.desktop", dest = "/usr/share/applications/Mitos.desktop", mode = "644" },
  { source = "../../contrib/Mitos.appdata.xml", dest = "/usr/share/metainfo/Mitos.appdata.xml", mode = "644" },
]

[package.metadata.generate-rpm.requires]
# All shipped grammar dylibs link libstdc++.so.6 (the ms binary does not);
# without this entry a target lacking libstdc++ would install cleanly but
# silently fail to load every grammar.
"libstdc++" = "*"

[features]
default = ["git", "syntax-diff"]
syntax-diff = ["view/syntax-diff"]
unicode-lines = ["core/unicode-lines", "view/unicode-lines"]
# Enables process fixture binaries; application behavior is chosen at construction.
integration = []
git = ["view/git"]

[[bin]]
name = "ms"
path = "src/main.rs"

[[bin]]
name = "mitos-test-lsp"
path = "tests/fixtures/document_features_lsp.rs"
required-features = ["integration"]

[[bin]]
name = "mitos-test-dap"
path = "tests/fixtures/debug_adapter.rs"
required-features = ["integration"]

[[bin]]
name = "mitos-test-debuggee"
path = "tests/fixtures/debuggee.rs"
required-features = ["integration"]

[dependencies]
diagnostics.workspace = true
editor-config.workspace = true
language-config.workspace = true
text-io.workspace = true
text-layout.workspace = true
text-render.workspace = true
search.workspace = true
clipboard.workspace = true
grammar-build.workspace = true
language.workspace = true
theme.workspace = true
workspace.workspace = true
command-line.workspace = true
stdx.workspace = true
tempfile.workspace = true
core.workspace = true
buffer.workspace = true
event.workspace = true
fuzzy.workspace = true
view.workspace = true
lsp.workspace = true
snippets.workspace = true
dap.workspace = true
vcs.workspace = true
loader.workspace = true

anyhow.workspace = true
dashmap.workspace = true
parking_lot.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "io-util", "io-std", "time", "process", "macros", "fs", "parking_lot"] }
tui = { workspace = true, default-features = false, features = ["native"] }
ui-core.workspace = true
signal-hook.workspace = true
tokio-stream.workspace = true
futures-util.workspace = true
arc-swap.workspace = true
ratatui-image.workspace = true
image.workspace = true
termini.workspace = true
# Clipboard escape sequences and health queries are used on every platform.
termina.workspace = true
indexmap = { workspace = true, features = ["serde"] }

# Logging
log = { workspace = true, features = ["std"] }

# File picker
nucleo.workspace = true
ignore.workspace = true
# markdown doc rendering
pulldown-cmark.workspace = true
thiserror.workspace = true

# opening URLs
open.workspace = true

# config
toml.workspace = true

serde_json.workspace = true
serde.workspace = true


[target.'cfg(windows)'.dependencies]
crossterm.workspace = true
windows-sys = { workspace = true, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Console",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # IME auto-control (handlers/ime/platform/windows.rs): WM_IME_CONTROL
  # message-based IME state query/control via the default IME window.
  "Win32_UI_Input_Ime",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(not(windows))'.dependencies]
termina = { workspace = true, features = ["event-stream"] }
signal-hook-tokio = { workspace = true, features = ["futures-v0_3"] } # https://github.com/vorner/signal-hook/issues/100
libc.workspace = true

[dev-dependencies]
core = { workspace = true, features = ["integration"] }
tokio = { workspace = true, features = ["test-util"] }
spelling.workspace = true
indoc.workspace = true
vt100.workspace = true
same-file.workspace = true

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Pipes"] }
